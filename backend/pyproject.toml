[project]
name = "wws-adviser"
version = "0.1.0"
description = "WWS Adviser — 个人投资顾问（FastAPI 模块化单体）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "httpx>=0.28",
    "polars>=1.0",
    "argon2-cffi>=23.1",
    "python-ulid>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wws_adviser"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID251"]
# 层级隔离：domain.py 禁框架 import（1_REPO_STRUCTURE.md §3）。banned-api 全局生效，
# 通过 per-file-ignores 在非 domain 文件放行。

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi" = { msg = "domain 层禁用 FastAPI；仅 api 层可用" }
"sqlalchemy" = { msg = "domain 层禁用 SQLAlchemy；仅 models/repository/service 可用" }
"httpx" = { msg = "domain 层禁用 httpx" }

[tool.ruff.lint.per-file-ignores]
# domain.py 不在此列 → TID251 生效（禁框架）；其余文件允许使用框架
"src/wws_adviser/api/**/*.py" = ["TID251"]
"src/wws_adviser/core/**/*.py" = ["TID251"]
"src/wws_adviser/main.py" = ["TID251"]
"src/wws_adviser/modules/*/models.py" = ["TID251"]
"src/wws_adviser/modules/*/repository.py" = ["TID251"]
"src/wws_adviser/modules/*/service.py" = ["TID251"]
"src/wws_adviser/modules/*/schemas.py" = ["TID251"]
"src/wws_adviser/modules/*/api.py" = ["TID251"]
"src/wws_adviser/modules/*/cli.py" = ["TID251"]
"migrations/**/*.py" = ["TID251"]
"tests/**/*.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src/wws_adviser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
