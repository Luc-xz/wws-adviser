<body class="bg-canvas min-h-screen flex flex-col font-sans text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-space-2xl pt-20 pb-10 w-full max-w-md mx-auto">
<!-- Header Section -->
<header class="w-full text-center mb-space-2xl flex flex-col items-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-space-lg shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    query_stats
                </span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tight mb-space-sm">
                WWS Adviser
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                看清持仓、风险与依据，再做决定。
            </p>
</header>
<!-- Login Card -->
<div class="w-full bg-surface border border-border-default rounded-xl p-space-xl shadow-sm">
<form action="#" class="space-y-space-lg" method="POST">
<!-- Input Group -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-space-xs" for="password">
                        访问凭证
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">
                                lock
                            </span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-border-default rounded-lg bg-surface text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-colors placeholder-outline-variant" id="password" name="password" placeholder="输入安全密码以继续" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-sm text-label-sm text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors active:scale-[0.98]" type="submit">
                    登录
                </button>
</form>
</div>
<!-- System Status Footer -->
<footer class="mt-space-2xl w-full text-center">
<div class="inline-flex items-center gap-2 px-3 py-1.5 bg-surface-container-low rounded-full border border-border-default">
<div class="w-2 h-2 rounded-full bg-market-up animate-pulse"></div>
<span class="font-caption text-caption text-on-surface-variant">
                    终端连接安全 • 区域节点就绪
                </span>
</div>
</footer>
</main>
<!-- Suppressed Shell Components for Transactional View -->
<!-- Navigation intentionally omitted per "The UX Goal: If the user is in a focused journey (Login)... hide the shell" -->
