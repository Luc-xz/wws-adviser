            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-canvas text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Top Navigation (Transactional, no shell navs per logic) -->
<header class="bg-surface border-b border-border-default flex items-center h-16 px-margin-mobile sticky top-0 z-50">
<button aria-label="返回上一步" class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<h1 class="font-headline-h2 text-headline-h2 text-on-surface">WWS Adviser 配置</h1>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col pb-24 max-w-2xl mx-auto w-full px-margin-mobile pt-space-lg">
<!-- Progress Bar -->
<div class="mb-space-xl">
<div class="flex justify-between items-center mb-space-sm">
<span class="font-label-sm text-label-sm text-secondary">步骤 2 / 6</span>
<span class="font-label-sm text-label-sm text-primary">风险偏好与风控限制</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary transition-all duration-500 ease-in-out" style="width: 33.33%;"></div>
</div>
</div>
<!-- Header Section -->
<div class="mb-space-xl">
<h2 class="font-headline-h1 text-headline-h1 text-on-surface mb-space-sm">设置您的风控边界</h2>
<p class="font-body-md text-body-md text-secondary">建立严格的纪律是稳健投资的第一步。请设定您的核心持仓限制，系统将以此为基准为您提供警报与建议。</p>
</div>
<!-- Settings Cards -->
<div class="space-y-space-md">
<!-- Quick Action: Default Profile -->
<button class="w-full bg-surface-container-low border border-primary-fixed-dim rounded-lg p-space-md flex items-center justify-between hover:bg-surface-variant transition-colors group">
<div class="flex items-center gap-space-md">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">
<span class="material-symbols-outlined filled">security</span>
</div>
<div class="text-left">
<div class="font-headline-h3 text-headline-h3 text-on-surface">应用稳健型默认值</div>
<div class="font-caption text-caption text-secondary">适合追求长期稳定增长的投资者</div>
</div>
</div>
<span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Card 1: Single Position Limit -->
<div class="bg-surface border border-border-default rounded-lg p-space-lg shadow-sm">
<div class="flex justify-between items-start mb-space-md">
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface flex items-center gap-2">
                            单标的持仓上限
                            <span class="material-symbols-outlined text-secondary text-sm cursor-help" title="单一资产占总资金的最大比例">info</span>
</h3>
<p class="font-caption text-caption text-secondary mt-1">防止个股黑天鹅事件造成毁灭性打击</p>
</div>
<div class="relative w-24">
<input class="w-full border border-border-default rounded-md px-3 py-2 font-body-lg text-body-lg text-right focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" max="100" min="1" type="number" value="15"/>
<span class="absolute right-3 top-2 font-body-lg text-body-lg text-secondary pointer-events-none">%</span>
</div>
</div>
<!-- Range Slider Visual -->
<div class="px-2">
<input class="w-full h-1 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="1" type="range" value="15"/>
<div class="flex justify-between font-caption text-caption text-secondary mt-2">
<span>激进 (50%+)</span>
<span>平衡 (10-20%)</span>
<span>极度分散 (5%)</span>
</div>
</div>
</div>
<!-- Card 2: Sector Limit -->
<div class="bg-surface border border-border-default rounded-lg p-space-lg shadow-sm">
<div class="flex justify-between items-start mb-space-md">
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface flex items-center gap-2">
                            单一行业持仓上限
                            <span class="material-symbols-outlined text-secondary text-sm cursor-help" title="同一行业板块占总资金的最大比例">info</span>
</h3>
<p class="font-caption text-caption text-secondary mt-1">规避行业系统性风险</p>
</div>
<div class="relative w-24">
<input class="w-full border border-border-default rounded-md px-3 py-2 font-body-lg text-body-lg text-right focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" max="100" min="1" type="number" value="30"/>
<span class="absolute right-3 top-2 font-body-lg text-body-lg text-secondary pointer-events-none">%</span>
</div>
</div>
<!-- Range Slider Visual -->
<div class="px-2">
<input class="w-full h-1 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="1" type="range" value="30"/>
</div>
</div>
<!-- Card 3: Minimum Cash Reserve -->
<div class="bg-surface border border-border-default rounded-lg p-space-lg shadow-sm">
<div class="flex justify-between items-start mb-space-md">
<div>
<h3 class="font-headline-h3 text-headline-h3 text-on-surface flex items-center gap-2">
                            最低现金储备比例
                            <span class="material-symbols-outlined text-secondary text-sm cursor-help" title="账户中保留的现金底线">info</span>
</h3>
<p class="font-caption text-caption text-secondary mt-1">确保应对极端情况的流动性</p>
</div>
<div class="relative w-24">
<input class="w-full border border-border-default rounded-md px-3 py-2 font-body-lg text-body-lg text-right focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" max="100" min="0" type="number" value="10"/>
<span class="absolute right-3 top-2 font-body-lg text-body-lg text-secondary pointer-events-none">%</span>
</div>
</div>
<!-- Range Slider Visual -->
<div class="px-2">
<input class="w-full h-1 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="0" type="range" value="10"/>
</div>
<!-- Warning Chip if cash is 0 -->
<div class="mt-space-md bg-surface-container p-space-sm rounded border border-outline-variant flex items-start gap-space-sm">
<span class="material-symbols-outlined text-primary text-base">lightbulb</span>
<p class="font-caption text-caption text-on-surface-variant flex-1">
                        建议保持至少 5-10% 的现金，以便在市场回调时有资金加仓优质资产。
                    </p>
</div>
</div>
</div>
</main>
<!-- Bottom Fixed Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border-default p-margin-mobile shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50">
<div class="max-w-2xl mx-auto flex gap-space-md">
<button class="flex-1 bg-surface border border-border-default text-on-surface font-label-sm text-label-sm py-3 rounded-lg hover:bg-surface-container-low transition-colors">
                稍后设置
            </button>
<button class="flex-[2] bg-primary text-on-primary font-label-sm text-label-sm py-3 rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex justify-center items-center gap-2">
                继续下一步
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<!-- Safe area padding for mobile -->
<div class="h-safe-bottom"></div>
</div>
<!-- Script to link sliders to inputs for basic interactivity -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.bg-surface.border');
            cards.forEach(card => {
                const numberInput = card.querySelector('input[type="number"]');
                const rangeInput = card.querySelector('input[type="range"]');
                
                if (numberInput && rangeInput) {
                    numberInput.addEventListener('input', (e) => {
                        rangeInput.value = e.target.value;
                    });
                    rangeInput.addEventListener('input', (e) => {
                        numberInput.value = e.target.value;
                    });
                }
            });
        });
    </script>
</body></html>
