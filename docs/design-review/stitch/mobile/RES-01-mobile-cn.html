<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>WWS Adviser - 新建研究</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "risk-warning": "#DC6803",
                      "surface-tint": "#2c53d1",
                      "canvas": "#F5F7FA",
                      "secondary-fixed": "#dee2ef",
                      "primary": "#063cbc",
                      "tertiary": "#484b4d",
                      "secondary": "#5a5e69",
                      "tertiary-fixed": "#e0e3e5",
                      "inverse-primary": "#b7c4ff",
                      "primary-container": "#3157d5",
                      "surface-container-lowest": "#ffffff",
                      "on-surface": "#141b2c",
                      "inverse-on-surface": "#edf0ff",
                      "market-down": "#079455",
                      "on-primary-fixed-variant": "#0038b6",
                      "surface-container-high": "#e0e8ff",
                      "secondary-container": "#dee2ef",
                      "surface-variant": "#dbe2f9",
                      "secondary-fixed-dim": "#c2c6d3",
                      "surface-container": "#e9edff",
                      "primary-fixed": "#dde1ff",
                      "tertiary-container": "#606365",
                      "on-secondary-container": "#60646f",
                      "primary-fixed-dim": "#b7c4ff",
                      "on-tertiary-container": "#dde0e1",
                      "error-container": "#ffdad6",
                      "on-primary-fixed": "#001452",
                      "on-tertiary-fixed-variant": "#444749",
                      "error": "#ba1a1a",
                      "on-primary-container": "#d8ddff",
                      "on-error": "#ffffff",
                      "on-secondary-fixed": "#171c25",
                      "background": "#f9f9ff",
                      "tertiary-fixed-dim": "#c4c7c9",
                      "surface-container-low": "#f1f3ff",
                      "on-secondary-fixed-variant": "#424751",
                      "market-up": "#D92D20",
                      "on-surface-variant": "#444654",
                      "risk-critical": "#C11574",
                      "inverse-surface": "#293041",
                      "outline": "#747685",
                      "surface-container-highest": "#dbe2f9",
                      "surface-dim": "#d2daf0",
                      "on-tertiary-fixed": "#191c1e",
                      "on-tertiary": "#ffffff",
                      "on-secondary": "#ffffff",
                      "on-primary": "#ffffff",
                      "on-error-container": "#93000a",
                      "border-default": "#E4E7EC",
                      "surface-bright": "#f9f9ff",
                      "on-background": "#141b2c",
                      "surface": "#FFFFFF",
                      "outline-variant": "#c4c5d6"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "unit": "4px",
                      "gutter-mobile": "12px",
                      "space-xl": "24px",
                      "space-sm": "8px",
                      "space-md": "12px",
                      "space-lg": "16px",
                      "space-2xl": "32px",
                      "space-xs": "4px"
              },
              "fontFamily": {
                      "micro-badge": ["Inter"],
                      "display-lg": ["Inter"],
                      "caption": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-h2": ["Inter"],
                      "headline-h1": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "headline-h3": ["Inter"],
                      "label-sm": ["Inter"]
              },
              "fontSize": {
                      "micro-badge": ["11px", {"lineHeight": "1.35", "fontWeight": "500"}],
                      "display-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "caption": ["12px", {"lineHeight": "1.45", "fontWeight": "400"}],
                      "body-md": ["14px", {"lineHeight": "1.55", "fontWeight": "400"}],
                      "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "headline-h2": ["20px", {"lineHeight": "1.35", "fontWeight": "600"}],
                      "headline-h1": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                      "display-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "headline-h3": ["17px", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "label-sm": ["13px", {"lineHeight": "1.4", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom scrollbar for horizontal lists */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-canvas text-on-surface antialiased min-h-screen flex flex-col font-body-md">
<!-- Header (Task/Context focused, no main nav) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-surface border-b border-border-default sticky top-0 z-10">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-h2 text-headline-h2 font-bold text-primary">新建研究</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex flex-col p-margin-mobile gap-space-xl pb-[120px]">
<!-- Research Type Toggle (Segmented Control) -->
<div class="bg-surface-container-low p-1 rounded-lg flex w-full border border-border-default">
<button class="flex-1 py-2 text-center rounded-md bg-surface shadow-sm border border-border-default font-label-sm text-label-sm text-primary font-bold">公司研究</button>
<button class="flex-1 py-2 text-center rounded-md font-label-sm text-label-sm text-on-surface-variant">行业研究</button>
</div>
<!-- Search Instrument -->
<section class="flex flex-col gap-space-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">目标标的</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">search</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface border border-border-default rounded-lg font-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="搜索代码、公司名称..." type="text">
</div>
<!-- Quick Chips -->
<div class="flex gap-2 mt-1 overflow-x-auto hide-scrollbar py-1">
<button class="whitespace-nowrap px-3 py-1.5 bg-surface border border-border-default rounded-full font-caption text-caption text-secondary hover:bg-surface-container-low transition-colors">AAPL</button>
<button class="whitespace-nowrap px-3 py-1.5 bg-surface border border-border-default rounded-full font-caption text-caption text-secondary hover:bg-surface-container-low transition-colors">MSFT</button>
<button class="whitespace-nowrap px-3 py-1.5 bg-surface border border-border-default rounded-full font-caption text-caption text-secondary hover:bg-surface-container-low transition-colors">NVDA</button>
<button class="whitespace-nowrap px-3 py-1.5 bg-surface border border-border-default rounded-full font-caption text-caption text-secondary hover:bg-surface-container-low transition-colors">TSLA</button>
</div>
</section>
<!-- Focus Areas (Bento Grid Style) -->
<section class="flex flex-col gap-space-sm">
<div class="flex justify-between items-end mb-1">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">研究重点</label>
<span class="font-caption text-caption text-primary cursor-pointer">全选</span>
</div>
<div class="grid grid-cols-2 gap-space-md">
<!-- Business -->
<div class="bg-surface border-2 border-primary rounded-xl p-4 flex flex-col gap-2 relative cursor-pointer hover:bg-surface-container-lowest transition-colors shadow-sm">
<div class="absolute top-3 right-3 bg-primary text-on-primary rounded-full w-5 h-5 flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl">storefront</span>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface">业务模型</h3>
<p class="font-caption text-caption text-on-surface-variant mt-0.5 line-clamp-1">模型与策略</p>
</div>
</div>
<!-- Finance -->
<div class="bg-surface border border-border-default rounded-xl p-4 flex flex-col gap-2 relative cursor-pointer hover:border-outline transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-2xl">account_balance</span>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface">财务状况</h3>
<p class="font-caption text-caption text-on-surface-variant mt-0.5 line-clamp-1">报表与健康度</p>
</div>
</div>
<!-- Valuation -->
<div class="bg-surface border-2 border-primary rounded-xl p-4 flex flex-col gap-2 relative cursor-pointer hover:bg-surface-container-lowest transition-colors shadow-sm">
<div class="absolute top-3 right-3 bg-primary text-on-primary rounded-full w-5 h-5 flex items-center justify-center">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="material-symbols-outlined text-primary text-2xl">timeline</span>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface">估值水平</h3>
<p class="font-caption text-caption text-on-surface-variant mt-0.5 line-clamp-1">指标与对比</p>
</div>
</div>
<!-- Risk -->
<div class="bg-surface border border-border-default rounded-xl p-4 flex flex-col gap-2 relative cursor-pointer hover:border-outline transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-2xl">warning</span>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface">风险评估</h3>
<p class="font-caption text-caption text-on-surface-variant mt-0.5 line-clamp-1">红旗与威胁</p>
</div>
</div>
</div>
</section>
<!-- Depth Selection -->
<section class="flex flex-col gap-space-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">研究深度</label>
<div class="flex flex-col gap-space-sm">
<!-- Standard (Selected) -->
<div class="bg-surface-container-low border border-primary rounded-xl p-4 flex items-start gap-3 cursor-pointer">
<div class="mt-0.5 rounded-full border-4 border-primary w-5 h-5 flex-shrink-0 bg-surface"></div>
<div class="flex-grow">
<div class="flex justify-between items-center">
<h4 class="font-label-sm text-label-sm text-on-surface">标准研究</h4>
<span class="font-micro-badge text-micro-badge px-2 py-0.5 bg-surface rounded text-on-surface-variant border border-border-default flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">schedule</span> 约 2 分钟</span>
</div>
<p class="font-caption text-caption text-on-surface-variant mt-1">包含关键洞察与数据点的全面概览</p>
</div>
</div>
<!-- Quick -->
<div class="bg-surface border border-border-default rounded-xl p-4 flex items-start gap-3 cursor-pointer hover:border-outline transition-colors">
<div class="mt-0.5 rounded-full border-2 border-outline-variant w-5 h-5 flex-shrink-0"></div>
<div class="flex-grow">
<div class="flex justify-between items-center">
<h4 class="font-label-sm text-label-sm text-on-surface">快速摘要</h4>
<span class="font-micro-badge text-micro-badge px-2 py-0.5 bg-surface-container-low rounded text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">schedule</span> &lt; 1 分钟</span>
</div>
<p class="font-caption text-caption text-on-surface-variant mt-1">高层执行摘要与即时要点</p>
</div>
</div>
<!-- Deep -->
<div class="bg-surface border border-border-default rounded-xl p-4 flex items-start gap-3 cursor-pointer hover:border-outline transition-colors opacity-75">
<div class="mt-0.5 rounded-full border-2 border-outline-variant w-5 h-5 flex-shrink-0"></div>
<div class="flex-grow">
<div class="flex justify-between items-center">
<h4 class="font-label-sm text-label-sm text-on-surface">深度钻研</h4>
<span class="font-micro-badge text-micro-badge px-2 py-0.5 bg-surface-container-low rounded text-on-surface-variant flex items-center gap-1"><span class="material-symbols-outlined text-[12px]">schedule</span> 约 5 分钟</span>
</div>
<p class="font-caption text-caption text-on-surface-variant mt-1">包含历史背景与预测的详尽分析</p>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border-default p-margin-mobile pb-safe z-20">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-sm text-label-sm font-bold flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors shadow-sm">
<span class="material-symbols-outlined fill-icon text-lg">science</span>
            开始研究
        </button>
</div>
</body></html>
